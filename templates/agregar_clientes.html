<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo cliente | Taller #3 Programacion IV</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Estilos.css') }}">
</head>
<body>
    <div class="dividida">
 
        <aside class="panel">
            <a class="marca" href="{{ url_for('inicio') }}">Taller #3 Programacion IV</a>
 
            <div>
                <h1>Nuevo cliente</h1>
                <p>Registra los datos de la persona para añadirla a tu directorio.</p>
            </div>
 
            <a class="volver" href="{{ url_for('clientes') }}">Volver a clientes</a>
        </aside>
 
        <main class="campos">
            <form method="POST">
                <label>
                    Nombre completo
                    <input type="text" name="nombre" maxlength="50" required placeholder="Ej. Juan Pérez">
                </label>
 
                <label>
                    Correo electrónico
                    <input type="email" name="correo" maxlength="50" required placeholder="Ej. juan@email.com">
                </label>
 
                <label>
                    Teléfono
                    <input type="tel" name="telefono" maxlength="20" placeholder="Ej. 6000-0000">
                </label>
 
                <div class="acciones-formulario">
                    <button class="boton" type="submit">Guardar cliente</button>
                    <a class="enlace" href="{{ url_for('clientes') }}">Cancelar</a>
                </div>
            </form>
        </main>
 
    </div>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar cliente | Mi tienda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div class="marca">Mi tienda</div>
            <h1>Editar cliente</h1>
            <p class="subtitulo">Modifica los datos del cliente.</p>
        </header>

        <section class="contenido">
            <form method="POST">
                <label>
                    Nombre
                    <input name="nombre" value="{{ cliente.nombre }}">
                </label>

                <label>
                    Correo
                    <input name="correo" value="{{ cliente.correo }}">
                </label>

                <label>
                    Teléfono
                    <input name="telefono" value="{{ cliente.telefono }}">
                </label>

                <div class="acciones-formulario">
                    <button type="submit">Guardar cambios</button>
                    <a class="enlace" href="{{ url_for('clientes') }}">Cancelar</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
